<style>
:root{
  --brand:#0d6e8f;
  --brand-dark:#094f68;
  --brand-light:#e6f4f8;
  --accent:#f2994a;
  --danger:#e0483e;
  --success:#1e9e6b;
  --bg:#f4f7f9;
  --card:#ffffff;
  --text:#16232b;
  --text-dim:#5c6b73;
  --border:#dfe7eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#182430; --text:#eef3f6; --text-dim:#93a2ac;
    --border:#2a3946; --brand-light:#12303b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --card:#182430; --text:#eef3f6; --text-dim:#93a2ac;
  --border:#2a3946; --brand-light:#12303b;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; font-family:"Tahoma","Segoe UI",Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
#app-root{display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; position:relative;}

header.topbar{
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
header.topbar h1{font-size:17px; margin:0; font-weight:700;}
header.topbar .sub{font-size:11px; opacity:.85;}
header.topbar .icon-btn{background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:10px; padding:8px 10px; font-size:16px;}

main#view{flex:1; overflow-y:auto; padding:14px 14px 90px 14px;}

nav.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px;
  display:flex; background:var(--card); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px); z-index:50;
}
nav.tabbar button{
  flex:1; background:none; border:none; padding:8px 1px 7px; color:var(--text-dim);
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9.5px;
}
nav.tabbar button .ic{font-size:17px;}
nav.tabbar button.active{color:var(--brand);}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.card h2{margin:0 0 10px; font-size:15px; color:var(--brand);}
.section-title{font-size:14px; font-weight:700; color:var(--text); margin:18px 0 8px;}
.muted{color:var(--text-dim); font-size:12.5px;}

.btn{
  border:none; border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary{background:var(--brand); color:#fff; width:100%;}
.btn-accent{background:var(--accent); color:#fff; width:100%;}
.btn-outline{background:transparent; color:var(--brand); border:1.5px solid var(--brand);}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:7px 10px; font-size:12.5px;}
.btn-ghost{background:var(--brand-light); color:var(--brand-dark); padding:8px 10px; font-size:12.5px;}
.btn-sm{padding:7px 10px; font-size:12.5px; border-radius:10px;}
.btn:disabled{opacity:.4;}
.btn-row{display:flex; gap:8px;}

.grid-btns{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.pick-btn{
  background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:12px 10px;
  text-align:right; font-size:13.5px; font-weight:600; color:var(--text); display:flex;
  flex-direction:column; gap:3px; align-items:flex-start;
}
.pick-btn small{color:var(--text-dim); font-weight:400; font-size:11px;}
.pick-btn.selected{border-color:var(--brand); background:var(--brand-light); color:var(--brand-dark);}
.pick-btn .stock-low{color:var(--danger); font-weight:700;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;}
.stat-card .num{font-size:20px; font-weight:800; color:var(--brand);}
.stat-card .lbl{font-size:11.5px; color:var(--text-dim); margin-top:2px;}

.top-actions{display:flex; gap:10px; margin:14px 0 4px;}
.action-tile{
  flex:1; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:#fff;
  border:none; border-radius:16px; padding:18px 10px; font-size:13.5px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.action-tile.alt{background:linear-gradient(135deg,var(--accent),#c9762b);}
.action-tile .ic{font-size:26px;}

.row-between{display:flex; align-items:center; justify-content:space-between;}
.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
.badge-ok{background:#e2f6ec; color:var(--success);}
.badge-low{background:#fdeceb; color:var(--danger);}
.badge-warn{background:#fdf3e3; color:#b5790c;}

.list-item{
  background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:9px;
  position:relative;
}
.list-item .title-line{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13.5px;}
.list-item .meta{font-size:11.5px; color:var(--text-dim); margin-top:4px;}
.list-item .sum{font-weight:700; color:var(--brand-dark); font-size:14px;}

.list-item.has-img{
  min-height:132px; color:#fff; background-size:cover; background-position:center;
  display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; border-color:transparent;
}
.list-item.has-img::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,15,20,.05) 35%, rgba(8,12,16,.88) 100%);
}
.list-item.has-img > *{position:relative; z-index:1;}
.list-item.has-img .title-line{text-shadow:0 1px 3px rgba(0,0,0,.5);}
.list-item.has-img .meta{color:rgba(255,255,255,.88);}
.list-item.has-img .badge-ok{background:rgba(30,158,107,.92); color:#fff;}
.list-item.has-img .badge-low{background:rgba(224,72,62,.94); color:#fff;}
.list-item.has-img .btn-ghost{background:rgba(255,255,255,.92); color:var(--brand-dark);}
.list-item.has-img .btn-danger{background:rgba(255,255,255,.12); border-color:#fff; color:#fff;}

.stepper{display:flex; align-items:center; gap:12px; justify-content:center; margin:10px 0;}
.stepper button{width:42px; height:42px; border-radius:50%; border:1.5px solid var(--brand); background:var(--brand-light); color:var(--brand-dark); font-size:20px; font-weight:700;}
.stepper .val{font-size:22px; font-weight:800; min-width:58px; text-align:center;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.chip{border:1.5px solid var(--border); background:var(--card); border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--text);}
.chip.selected{border-color:var(--accent); background:#fff3e8; color:#b5590a;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.field input, .field select{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--card); color:var(--text); font-size:14px;
}

.progress-dots{display:flex; gap:6px; justify-content:center; margin-bottom:14px;}
.progress-dots span{width:8px; height:8px; border-radius:50%; background:var(--border);}
.progress-dots span.active{background:var(--brand); width:20px; border-radius:6px;}

.sticky-bottom{
  position:sticky; bottom:0; background:var(--bg); padding-top:10px; margin-top:6px;
}

.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.sheet-handle{width:40px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 12px;}

.bar-row{margin-bottom:10px;}
.bar-row .lbl-line{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
.bar-track{background:var(--border); border-radius:6px; height:8px; overflow:hidden;}
.bar-fill{background:var(--brand); height:100%; border-radius:6px;}

.empty-state{text-align:center; padding:40px 10px; color:var(--text-dim);}
.empty-state .ic{font-size:38px; margin-bottom:8px;}

.toast{
  position:fixed; bottom:calc(78px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:#1f2b33; color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:300;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.voucher-print{background:#fff; color:#111; border-radius:14px; padding:16px;}
.voucher-print table{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
.voucher-print th, .voucher-print td{border:1px solid #ccc; padding:6px; text-align:center;}
.voucher-print .vp-head{text-align:center; margin-bottom:8px;}
.voucher-print .vp-head h2{margin:0; color:var(--brand-dark);}

.perm-list{border:1.5px solid var(--border); border-radius:12px; background:var(--card); padding:4px 10px;}
.perm-list label{display:flex; align-items:center; gap:10px; padding:9px 2px; font-size:13.5px; color:var(--text); border-bottom:1px solid var(--border); cursor:pointer;}
.perm-list label:last-child{border-bottom:none;}
.perm-list input[type=checkbox]{width:19px; height:19px; flex-shrink:0; accent-color:var(--brand);}
.login-wrap{
  min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px 6px;
}
.login-card{
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  padding:26px 20px; width:100%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.08);
}

@media print{
  header.topbar, nav.tabbar, .no-print{display:none !important;}
  main#view{padding:0; overflow:visible;}
  body{background:#fff;}
}
</style>

<script>
/* ============================================================
   FIREBASE CONFIG
   حط هنا بيانات مشروعك على Firebase (من Project settings > عام > تطبيقاتك)
   لو سبتها زي ما هي، التطبيق هيشتغل بس من غير مزامنة بين الأجهزة.
============================================================ */

/* ============================================================
   STATE
============================================================ */
function loadSession(){
  try{
    const raw = localStorage.getItem("of_session");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSession(user){
  try{ localStorage.setItem("of_session", JSON.stringify(user)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem("of_session"); }catch(e){}
}

const state = {
  db: null,
  dbReady: false,
  dbAvailable: null, // null=unknown, true/false once resolved
  products: [],
  reps: [],
  merchants: [],
  vouchers: [],
  returns: [],
  incoming: [],
  users: [],
  activity: [],
  stocktakes: [],
  repDeliveries: [],
  unloads: [],
  repView: null,
  currentUser: loadSession(), // {username, role} - بيتحمل من الجلسة المحفوظة لحد ما نتأكد منه بعد تحميل المستخدمين
  loaded: {products:false, reps:false, merchants:false, vouchers:false, returns:false, incoming:false, users:false, activity:false, settings:false, stocktakes:false, repDeliveries:false, unloads:false},
  tab: "home",
  wizard: null // active wizard state object, or null
};

/* ============================================================
   الأدوار والصلاحيات
   - superadmin: كل الصلاحيات + إدارة المستخدمين + الجرد الفعلي + شاشة النشاط (اليوزر administrator)
   - admin / user: بصلاحيات بتتحدد بالـ checkboxes من السوبر أدمن
============================================================ */
const ROLE_LABELS = {user:"مستخدم", admin:"أدمن", superadmin:"سوبر أدمن", rep:"مندوب"};
const PERMS = [
  {key:"voucher",   label:"🧾 إذن صرف جديد"},
  {key:"returns",   label:"↩️ تسجيل مرتجع"},
  {key:"incoming",  label:"📥 الوارد"},
  {key:"inventory", label:"📦 المخزون"},
  {key:"history",   label:"🧾 السجل (أذون ومرتجعات)"},
  {key:"reports",   label:"📊 التقارير"},
  {key:"stocktake", label:"📋 الجرد (عرض وطباعة)"},
  {key:"receive",   label:"📮 استلام مرتجعات المناديب"},
  {key:"export",    label:"📤 تصدير Excel"}
];
function defaultPerms(){ const o={}; PERMS.forEach(p=>{ o[p.key]=true; }); return o; }
function effectiveRole(u){
  if(!u) return "user";
  if(u.username==="administrator") return "superadmin";
  return u.role || "user";
}
function sessionFromUser(u){
  return {username:u.username, role:effectiveRole(u), title:(u.title||"").trim(), perms:u.perms||null, repName:(u.repName||"")};
}
function userTitleOf(u){
  return (u && u.title && String(u.title).trim()) || ROLE_LABELS[u && u.role] || "مستخدم";
}
function isSuper(){
  return !!(state.currentUser && state.currentUser.role === "superadmin");
}
function isAdmin(){ // أدمن أو سوبر أدمن
  return !!(state.currentUser && (state.currentUser.role === "admin" || state.currentUser.role === "superadmin"));
}
function hasPerm(key){
  const u = state.currentUser;
  if(!u) return false;
  if(u.role === "rep") return false;
  if(u.role === "superadmin") return true;
  if(!u.perms) return true; // مستخدمين قدام لسه ما اتحددلهمش صلاحيات: بيشوفوا كل حاجة زي الأول
  return !!u.perms[key];
}
const TAB_PERMS = {inventory:"inventory", incoming:"incoming", history:"history", reports:"reports", stocktake:"stocktake", activity:"@super", receive:"receive"};
function canSeeTab(tab){
  if(state.currentUser && state.currentUser.role==="rep") return tab==="home"||tab==="settings";
  const req = TAB_PERMS[tab];
  if(!req) return true;
  if(req === "@super") return isSuper();
  return hasPerm(req);
}
function noPermToast(){ toast("ليس لديك صلاحية لهذه العملية"); }

function syncSessionWithUsers(){
  if(!state.currentUser) return;
  const match = state.users.find(u=>u.username===state.currentUser.username);
  if(!match){
    state.currentUser = null;
    clearSession();
    return;
  }
  const fresh = sessionFromUser(match);
  if(JSON.stringify(fresh) !== JSON.stringify(state.currentUser)){
    state.currentUser = fresh;
    saveSession(fresh);
  }
}
function updateHeaderGreeting(){
  const subEl = document.querySelector("header.topbar .sub");
  if(!subEl) return;
  subEl.textContent = state.currentUser
    ? `مرحبًا، ${state.currentUser.username} (${userTitleOf(state.currentUser)})`
    : "نظام إدارة المخزون والمبيعات";
  updateNetStatus();
}

const LOW_STOCK_THRESHOLD = 10;

function iconForProduct(name){
  name = name || "";
  if(/شيكولات/.test(name)) return "🍫";
  if(/جوز هند/.test(name)) return "🥥";
  if(/فراول/.test(name)) return "🍓";

  if(/كرواسون/.test(name)) return "🥐";

  if(/سندوتش/.test(name)) return "🥪";
  if(/حلاوة/.test(name)) return "🍯";
  return "🍪";
}

/* ============================================================
   PERIOD HELPERS (للتقارير: يومي/أسبوعي/شهري/ربع سنوي/نصف سنوي/سنوي)
============================================================ */
function dateToStr(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function startOfWeekMon(d){
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = day===0 ? -6 : 1-day;
  date.setDate(date.getDate()+diff);
  return date;
}
const PERIOD_LABELS = {day:"يومي", week:"أسبوعي", month:"شهري", quarter:"ربع سنوي", half:"نصف سنوي", year:"سنوي", all:"كل الفترات"};
function getPeriodRange(period, anchorStr){
  if(period==="all") return {start:null, end:null};
  const a = new Date(anchorStr+"T00:00:00");
  let start, end;
  if(period==="day"){ start=new Date(a); end=new Date(a); }
  else if(period==="week"){ start=startOfWeekMon(a); end=new Date(start); end.setDate(end.getDate()+6); }
  else if(period==="month"){ start=new Date(a.getFullYear(), a.getMonth(), 1); end=new Date(a.getFullYear(), a.getMonth()+1, 0); }
  else if(period==="quarter"){ const q=Math.floor(a.getMonth()/3); start=new Date(a.getFullYear(), q*3, 1); end=new Date(a.getFullYear(), q*3+3, 0); }
  else if(period==="half"){ const h=a.getMonth()<6?0:1; start=new Date(a.getFullYear(), h*6, 1); end=new Date(a.getFullYear(), h*6+6, 0); }
  else if(period==="year"){ start=new Date(a.getFullYear(),0,1); end=new Date(a.getFullYear(),11,31); }
  return {start: dateToStr(start), end: dateToStr(end)};
}
function shiftAnchor(period, anchorStr, dir){
  const a = new Date(anchorStr+"T00:00:00");
  if(period==="day") a.setDate(a.getDate()+dir);
  else if(period==="week") a.setDate(a.getDate()+7*dir);
  else if(period==="month") a.setMonth(a.getMonth()+dir);
  else if(period==="quarter") a.setMonth(a.getMonth()+3*dir);
  else if(period==="half") a.setMonth(a.getMonth()+6*dir);
  else if(period==="year") a.setFullYear(a.getFullYear()+dir);
  return dateToStr(a);
}
function inRange(dateStr, range){
  if(!dateStr) return false;
  if(range.start && dateStr<range.start) return false;
  if(range.end && dateStr>range.end) return false;
  return true;
}

/* ============================================================
   أوفلاين + ترقيم مؤقت/رسمي
============================================================ */
function deviceId(){
  let d=null; try{ d=localStorage.getItem("of_dev"); }catch(e){}
  if(!d){ d=Math.random().toString(36).replace(/[^a-z0-9]/g,"").slice(2,5).toUpperCase()||"XYZ"; try{ localStorage.setItem("of_dev",d); }catch(e){} }
  return d;
}
function nextLocalSeq(kind){
  const k="of_seq_"+kind; let n=0;
  try{ n=parseInt(localStorage.getItem(k)||"0",10)||0; }catch(e){}
  n++; try{ localStorage.setItem(k,String(n)); }catch(e){}
  return n;
}
const NO_FMT = {voucher:n=>String(n), "return":n=>"R-"+n, incoming:n=>"IN-"+n};
function localMaxFor(kind){
  if(kind==="voucher") return parseInt(nextVoucherNo(),10)-1;
  if(kind==="return") return parseInt(nextReturnNo().replace("R-",""),10)-1;
  return parseInt(nextIncomingNo().replace("IN-",""),10)-1;
}
function tempNo(kind){
  const s=nextLocalSeq(kind), d=deviceId();
  if(kind==="voucher") return d+"-"+(1000+s);
  return (kind==="return"?"R-":"IN-")+d+"-"+s;
}
// أونلاين: رقم رسمي متسلسل من عداد على السيرفر. أوفلاين: رقم مؤقت بادئته كود التليفون (بيتحول لرقم رسمي أول ما النت يرجع)
async function makeNumber(kind){
  const localMax = localMaxFor(kind);
  if(navigator.onLine && state.db){
    try{
      const ref = state.db.collection("settings").doc("counters");
      const n = await Promise.race([
        state.db.runTransaction(async t=>{
          const s = await t.get(ref);
          const cur = Math.max((s.exists && Number(s.data()[kind])) || 0, localMax);
          t.set(ref, {[kind]: cur+1}, {merge:true});
          return cur+1;
        }),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),4000))
      ]);
      return {number: NO_FMT[kind](n), pending:false};
    }catch(e){ console.warn("رقم مؤقت بدل الرسمي", e); }
  }
  return {number: tempNo(kind), pending:true};
}
function pendingFlags(nn){ return nn.pending ? {pendingNo:true, dev:deviceId()} : {}; }
let renumbering = false;
async function renumberPending(){
  if(renumbering || !navigator.onLine || !state.db || !allLoaded()) return;
  renumbering = true;
  try{
    const dev = deviceId();
    for(const kind of ["voucher","return","incoming"]){
      const col = kind==="voucher" ? "vouchers" : kind==="return" ? "returns" : "incoming";
      const list = state[col].filter(d=>d.pendingNo && d.dev===dev).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      for(const d of list){
        const r = await makeNumber(kind);
        if(r.pending) return;
        const old = d.number;
        state.db.collection(col).doc(d.id).update({number:r.number, pendingNo:false, tempNumber:old});
        if(kind==="voucher"){
          ["returns","repDeliveries"].forEach(c=>{
            state[c].filter(x=>x.voucherNumber===old).forEach(x=>state.db.collection(c).doc(x.id).update({voucherNumber:r.number}));
          });
        }
        logActivity("ترقيم رسمي بعد المزامنة", `${old} ← ${r.number}`);
      }
    }
  }catch(e){ console.error("renumber", e); }
  finally{ renumbering = false; }
}
// الكتابة على Firestore بتستنى رد السيرفر، وده بيعلّق أوفلاين. هنا بنرجّع فورًا لأن الكتابة اتحفظت محليًا وهتترفع لوحدها
function patchWrites(){
  try{
    const wrap=(proto,name)=>{
      const o=proto[name]; if(!o) return;
      proto[name]=function(...a){
        const p=o.apply(this,a);
        if(p && p.catch) p.catch(e=>{ console.error(name,e); toast("تعذّر رفع عملية للسيرفر"+(e&&e.code?" ("+e.code+")":"")); });
        return Promise.resolve(name==="add" ? {id:"local"} : undefined);
      };
    };
    wrap(firebase.firestore.CollectionReference.prototype,"add");
    ["set","update","delete"].forEach(n=>wrap(firebase.firestore.DocumentReference.prototype,n));
  }catch(e){ console.error("patchWrites", e); }
}

  const me = state.currentUser && state.currentUser.repName;

function deliveryFor(v){ return state.repDeliveries.find(d=>d.voucherId===v.id) || null; }
function lineUnit(l){ return l.packMode ? "علبة" : (l.unit||""); }
function qtyLabel(it){ return `${fmt(it.qty)} ${it.unit||""}${it.packQty?` (${fmt(it.packQty)} علبة)`:""}`; }
function heldReturnsFor(rep){ return state.repDeliveries.filter(d=>d.rep===rep && d.retStatus==="held"); }
function aggregateReturns(deliveries){
  const m={};
  deliveries.forEach(d=>(d.lines||[]).forEach(l=>{
    if(!(l.returnQty>0)) return;
    const q = l.packMode ? l.returnQty/l.upc : l.returnQty;
    const a = m[l.code] || (m[l.code]={code:l.code,name:l.name,unit:l.unit,price:l.price||0,qty:0,packMode:false,upc:l.upc,reasons:{}});
    a.qty += q; if(l.packMode) a.packMode = true; if(l.reason) a.reasons[l.reason]=1;
  }));
  return Object.values(m).map(a=>{
    const qty = Math.round(a.qty*1000)/1000;
    return {code:a.code,name:a.name,unit:a.unit,price:a.price,qty,
      packQty: a.packMode ? Math.round(qty*a.upc) : null, unitsPerCarton: a.packMode ? a.upc : null,
      reason: Object.keys(a.reasons).join("، ")};
  });
}
function deliveryBadge(v){
  const d = deliveryFor(v);
  if(!d) return `<span class="badge badge-warn">لم يُسلَّم</span>`;
  if(d.retStatus==="none") return `<span class="badge badge-ok">تم التسليم</span>`;
  if(d.retStatus==="held") return `<span class="badge badge-low">مرتجع معلّق</span>`;
  if(d.retStatus==="unloaded") return `<span class="badge badge-warn">تم التفريغ - بانتظار الأمين</span>`;
  return `<span class="badge badge-ok">تم استلام المرتجع</span>`;
}
function openRepVoucher(v){

    const packMode = !!it.packQty;
    const ordered = packMode ? Number(it.packQty) : (Number(it.qty)||0);
    const prev = d && (d.lines||[]).find(l=>l.code===it.code);
    return {code:it.code, name:it.name, unit:it.unit, price:it.price||0, ordered, packMode,
      upc: it.unitsPerCarton || unitsPerCartonFor(prod),
      delivered: prev ? prev.delivered : ordered, reason: prev ? (prev.reason||"") : ""};
  });
  state.repView = {voucherId:v.id, lines, readonly: !!(d && (d.retStatus==="unloaded"||d.retStatus==="received"))};

function saveRepDelivery(){

  const lines = rv.lines.map(l=>({code:l.code,name:l.name,unit:l.unit,price:l.price,ordered:l.ordered,delivered:l.delivered,
    packMode:l.packMode,upc:l.upc,returnQty:l.ordered-l.delivered,
    reason: l.ordered>l.delivered ? (l.reason||REP_REASONS[0]) : ""}));
  const hasRet = lines.some(l=>l.returnQty>0);
  const doc = {voucherId:v.id, voucherNumber:v.number, rep:v.rep, merchant:v.merchant, date:todayStr(), lines,

    deliveryIds:held.map(d=>d.id), voucherNumbers:held.map(d=>d.voucherNumber), status:"pending", createdAt:Date.now()});
  held.forEach(d=>state.db.collection("repDeliveries").doc(d.id).update({retStatus:"unloaded", unloadId:id}));
  logActivity("تفريغ مرتجعات مندوب", `${me.repName}: ${items.map(i=>`${i.name} ${qtyLabel(i)}`).join("، ")}`);

  state.repDeliveries.filter(d=>d.retStatus==="held").forEach(d=>{ (heldByRep[d.rep]=heldByRep[d.rep]||[]).push(d); });
  const dels = [...state.repDeliveries].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,30);
  const statusTxt = {none:"تم التسليم", held:"مرتجع مع المندوب", unloaded:"تم التفريغ", received:"تم الاستلام بالمخزن"};
  return `
    <div class="section-title">📮 بانتظار الاستلام</div>

      <div class="list-item">
        <div class="title-line"><span>${u.rep}</span><span class="muted" style="font-size:11px;">${fmtTime(u.createdAt)}</span></div>
        ${u.items.map(i=>`<div class="meta">• ${i.name}: <b>${qtyLabel(i)}</b></div>`).join("")}

        <button class="btn btn-primary btn-sm" data-recv="${u.id}" style="margin-top:8px;">✅ تأكيد الاستلام وإضافة للمخزون</button>
      </div>`).join("") : `<div class="muted">لا يوجد تفريغ بانتظار الاستلام</div>`}
    <div class="section-title">🚚 مرتجع لسه مع المناديب</div>
    ${Object.keys(heldByRep).length ? Object.keys(heldByRep).map(r=>`
      <div class="list-item"><div class="title-line"><span>${r}</span></div>
      ${aggregateReturns(heldByRep[r]).map(i=>`<div class="meta">• ${i.name}: ${qtyLabel(i)}</div>`).join("")}</div>`).join("") : `<div class="muted">لا يوجد</div>`}
    <div class="section-title">📋 سجل تسليمات المناديب</div>
    ${dels.length ? dels.map(d=>`
      <div class="list-item">
        <div class="title-line"><span>إذن #${d.voucherNumber}</span><span class="badge ${d.retStatus==='none'||d.retStatus==='received'?'badge-ok':'badge-warn'}">${statusTxt[d.retStatus]||""}</span></div>
        <div class="meta">${d.rep} → ${d.merchant||""} · ${d.date||""}</div>
        ${(d.lines||[]).map(l=>`<div class="meta">${l.name}: ✅ ${fmt(l.delivered)}${l.returnQty>0?` · ↩️ ${fmt(l.returnQty)} (${l.reason||""})`:""} ${lineUnit(l)}</div>`).join("")}
      </div>`).join("") : `<div class="muted">لا توجد تسليمات بعد</div>`}
    ${done.length ? `<div class="section-title">✔️ آخر تفريغات اتستلمت</div>${done.map(u=>`
      <div class="list-item"><div class="title-line"><span>${u.rep}</span><span class="muted" style="font-size:11px;">${fmtTime(u.receivedAt)}</span></div>
      <div class="meta">مرتجع ${u.returnNumber||""} · استلمه ${u.receivedBy||""}</div></div>`).join("")}` : ""}

function bindReceive(){
  document.querySelectorAll("[data-recv]").forEach(b=>b.onclick=()=>confirmUnload(b.dataset.recv));
}
async function confirmUnload(id){
  if(!hasPerm("receive")){ noPermToast(); return; }
  const u = state.unloads.find(x=>x.id===id);
  if(!u || u.status!=="pending") return;
  if(!confirm("تأكيد استلام المرتجع وإضافته للمخزون؟\n" + u.items.map(i=>`${i.name}: ${qtyLabel(i)}`).join("\n"))) return;
  const nn = await makeNumber("return");
  const items = u.items.map(i=>({code:i.code,name:i.name,unit:i.unit,price:i.price||0,qty:i.qty,
    reason:i.reason||"مرتجع مندوب", packQty:i.packQty||null, unitsPerCarton:i.unitsPerCarton||null}));
  state.db.collection("returns").doc("unl_"+id).set({number:nn.number, date:todayStr(), rep:u.rep,
    merchant:"مرتجع مندوب (تفريغ)", voucherNumber:(u.voucherNumbers||[]).join("، "), items,
    qty:items.reduce((s,it)=>s+(Number(it.qty)||0),0), createdAt:Date.now(), unloadId:id, ...pendingFlags(nn)});
  state.db.collection("unloads").doc(id).update({status:"received", receivedBy:state.currentUser.username, receivedAt:Date.now(), returnNumber:nn.number});
  (u.deliveryIds||[]).forEach(did=>state.db.collection("repDeliveries").doc(did).update({retStatus:"received"}));
  logActivity("استلام مرتجع مندوب", `${u.rep} - ${nn.number}`);
  toast("تم الاستلام وإضافة المرتجع للمخزون");
}

/* ============================================================
   DB INIT
============================================================ */
async function initDb(){
  try{
    if(!firebaseConfig || !firebaseConfig.apiKey || String(firebaseConfig.apiKey).indexOf("PASTE")===0){
      console.error("Firebase config غير مضبوط - حط بيانات مشروعك في firebaseConfig");
      state.dbAvailable = false;
      renderCurrentView();
      return;
    }
    if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn("persistence", e && e.code); }
    patchWrites();
    state.db = db;
    state.dbAvailable = true;
    subscribeCollection("products", db.collection("products"));
    subscribeCollection("reps", db.collection("reps"));
    subscribeCollection("merchants", db.collection("merchants"));
    subscribeCollection("vouchers", db.collection("vouchers"));
    subscribeCollection("returns", db.collection("returns"));
    subscribeCollection("incoming", db.collection("incoming"));
    subscribeCollection("users", db.collection("users"));
    subscribeCollection("activity", db.collection("activity"));
    subscribeCollection("settings", db.collection("settings"));
    subscribeCollection("stocktakes", db.collection("stocktakes"));
    subscribeCollection("repDeliveries", db.collection("repDeliveries"));
    subscribeCollection("unloads", db.collection("unloads"));
    setTimeout(()=>{ if(!allLoaded()){ Object.keys(state.loaded).forEach(k=>state.loaded[k]=true); renderCurrentView(); } }, 12000);
    seedIfNeeded();
  }catch(e){
    console.error("db init failed", e);
    state.dbAvailable = false;
    renderCurrentView();
  }
}

async function seedIfNeeded(){
  if(!navigator.onLine) return;
  try{
    const prodSnap = await state.db.collection("products").get();
    if(prodSnap.docs.length === 0 && !prodSnap.metadata.fromCache){
      await Promise.all(CATALOG.map(p=>state.db.collection("products").doc(p.code).set({
        code:p.code, name:p.name, category:p.category, unit:"كرتونة", opening:0, price:0
      })));
    }
  }catch(e){ console.error("seed products failed", e); }
  try{
    const userSnap = await state.db.collection("users").get();
    if(userSnap.docs.length === 0 && !userSnap.metadata.fromCache){
      await state.db.collection("users").doc("administrator").set({
        username:"administrator", password:"Senacola1@", role:"superadmin", createdAt:Date.now()
      });
    } else {
      const adm = userSnap.docs.find(d=>d.id==="administrator");
      if(adm && adm.data().role !== "superadmin"){
        await state.db.collection("users").doc("administrator").set({role:"superadmin"}, {merge:true});
      }
    }
  }catch(e){ console.error("seed admin failed", e); }
  try{
    const cfgDoc = await state.db.collection("settings").doc("config").get();
    if(!cfgDoc.exists){
      await state.db.collection("settings").doc("config").set({maxDiscountPct: 15});
    }
  }catch(e){ console.error("seed settings failed", e); }
}

function getMaxDiscount(){
  const cfg = state.settings.find(s=>s.id==="config");
  return cfg && typeof cfg.maxDiscountPct === "number" ? cfg.maxDiscountPct : 15;
}

async function approveHighDiscount(pct){
  const limit = getMaxDiscount();
  if(pct <= limit) return true;
  const pwd = prompt(`الخصم ${pct}% أعلى من الحد المسموح به بدون موافقة (${limit}%).\nأدخل كلمة سر الأدمن للموافقة:`);
  if(pwd === null) return false;
  const approved = state.users.some(u=>effectiveRole(u)!=="user" && effectiveRole(u)!=="rep" && u.password===pwd);
  if(!approved){ toast("كلمة السر غير صحيحة، تم إلغاء الإضافة"); return false; }
  logActivity("موافقة على خصم مرتفع", `${pct}%`);
  return true;
}

function logActivity(action, details){
  if(!state.db) return;
  const username = state.currentUser ? state.currentUser.username : "غير معروف";
  state.db.collection("activity").add({action, details: details||"", username, createdAt: Date.now()}).catch(e=>console.error(e));
}

async function tryLogin(username, password){
  if(!username || !password){ toast("أدخل اسم المستخدم وكلمة السر"); return; }
  const data = state.users.find(u=>u.username===username);
  if(!data){ toast("اسم المستخدم غير موجود"); return; }
  if(data.password !== password){ toast("كلمة السر غير صحيحة"); return; }
  state.currentUser = sessionFromUser(data);
  saveSession(state.currentUser);
  logActivity("تسجيل دخول");
  renderCurrentView();
}

function logout(){
  logActivity("تسجيل خروج");
  state.currentUser = null;
  clearSession();
  renderCurrentView();
}

function subscribeCollection(key, colRef){
  colRef.onSnapshot(
    snap=>{
      state[key] = snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
      state.loaded[key] = true;
      if(key==="users") syncSessionWithUsers();
      renderCurrentView();
    },
    err=>{
      console.error("snapshot error", key, err);
      state.loaded[key] = true; // علشان التطبيق ما يفضلش معلق لو مجموعة بيانات رفضت القراءة
      renderCurrentView();
    }
  );
}

function allLoaded(){
  return Object.values(state.loaded).every(Boolean);
}

/* ============================================================
   STOCK / REPORT CALCULATIONS
============================================================ */
function dispatchedQty(code){
  let total = 0;
  for(const v of state.vouchers){
    for(const it of (v.items||[])){
      if(it.code === code) total += Number(it.qty)||0;
    }
  }
  return total;
}
function returnedQty(code){
  let total = 0;
  for(const r of state.returns){
    for(const it of (r.items||[])){
      if(it.code === code) total += Number(it.qty)||0;
    }
  }
  return total;
}
function incomingQty(code){
  let total = 0;
  for(const inc of state.incoming){
    for(const it of (inc.items||[])){
      if(it.code === code) total += Number(it.qty)||0;
    }
  }
  return total;
}
function currentStock(p){
  return (Number(p.opening)||0) - dispatchedQty(p.code) + returnedQty(p.code) + incomingQty(p.code);
}
function unitsPerCartonFor(p){
  if(p && p.unitsPerCarton) return Number(p.unitsPerCarton)||4;
  return (p && String(p.category||"").trim()==="سادة") ? 8 : 4;
}
function nextVoucherNo(){
  let max = 1000;
  for(const v of state.vouchers){
    const n = parseInt(v.number,10);
    if(!isNaN(n) && n>max) max = n;
  }
  return String(max+1);
}
function nextReturnNo(){
  let max = 0;
  for(const r of state.returns){
    const n = parseInt(String(r.number).replace("R-",""),10);
    if(!isNaN(n) && n>max) max = n;
  }
  return "R-"+(max+1);
}
function nextIncomingNo(){
  let max = 0;
  for(const inc of state.incoming){
    const n = parseInt(String(inc.number).replace("IN-",""),10);
    if(!isNaN(n) && n>max) max = n;
  }
  return "IN-"+(max+1);
}

function toast(msg){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function forceRender(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  renderCurrentView();
}
function renderCurrentView(){
  // أثناء كتابة الجرد الفعلي لا نعيد رسم الشاشة (علشان الكيبورد ما يتقفلش لو جه تحديث من جهاز تاني)
  const ae = document.activeElement;
  if(ae && ae.classList && ae.classList.contains("rp-in")) return;
  if(state.tab==="stocktake" && !state.wizard && ae && ((ae.classList && ae.classList.contains("ac-input")) || ae.id==="stSearch" || ae.id==="stNote")) return;
  updateTabbarActive();
  applyBranding();
  updateHeaderGreeting();
  const view = document.getElementById("view");
  const tabbarEl = document.getElementById("tabbar");
  if(state.dbAvailable === false){
    tabbarEl.style.display = "none";
    view.innerHTML = renderDbUnavailable();
    return;
  }
  if(state.dbAvailable === null || !allLoaded()){
    tabbarEl.style.display = "none";
    view.innerHTML = `<div class="empty-state"><div class="ic">⏳</div>جارِ تحميل البيانات...</div>`;
    return;
  }
  if(!state.currentUser){
    tabbarEl.style.display = "none";
    view.innerHTML = renderLogin();
    bindLoginEvents();
    return;
  }
  tabbarEl.style.display = "flex";
  document.querySelectorAll("nav.tabbar button").forEach(b=>{
    b.style.display = canSeeTab(b.dataset.tab) ? "" : "none";
  });
  if(!canSeeTab(state.tab)) state.tab = "home";
  { const rb = document.querySelector('[data-tab="receive"]');
    if(rb){ const n = state.unloads.filter(u=>u.status==="pending").length; rb.innerHTML = '<span class="ic">📮</span>استلام' + (n ? " ("+n+")" : ""); } }
  if(isRep()){
    if(state.tab==="settings"){ view.innerHTML = renderRepSettings(); const lb = document.getElementById("repLogout"); if(lb) lb.onclick = logout; }
    else { view.innerHTML = renderRepHome(); bindRepHome(); }
    return;
  }
  if(state.wizard){
    view.innerHTML = renderWizard();
    bindWizardEvents();
    return;
  }
  switch(state.tab){
    case "home": view.innerHTML = renderHome(); bindHomeEvents(); break;
    case "inventory": view.innerHTML = renderInventory(); bindInventoryEvents(); break;
    case "incoming": view.innerHTML = renderIncoming(); bindIncomingEvents(); break;
    case "history": view.innerHTML = renderHistory(); bindHistoryEvents(); break;
    case "reports": view.innerHTML = renderReports(); bindReportsEvents(); break;
    case "stocktake": view.innerHTML = renderStocktake(); bindStocktakeEvents(); break;
    case "activity": view.innerHTML = renderActivity(); break;
    case "receive": view.innerHTML = renderReceive(); bindReceive(); break;
    case "settings": view.innerHTML = renderSettings(); bindSettingsEvents(); break;
    default: view.innerHTML = renderHome(); bindHomeEvents();
  }
}

/* ============================================================
   WIZARD: NEW VOUCHER
============================================================ */
function startVoucherWizard(){
  if(!hasPerm("voucher")){ noPermToast(); return; }
  if(!state.reps.length){ toast("أضف مندوبًا واحدًا على الأقل من الإعدادات أولًا"); return; }
  if(!state.merchants.length){ toast("أضف تاجرًا واحدًا على الأقل من الإعدادات أولًا"); return; }
  if(!state.products.length){ toast("أضف صنفًا واحدًا على الأقل من المخزون أولًا"); return; }
  state.wizard = {
    type:"voucher", step:1,
    rep:null, merchant:null, date: todayStr(),
    items:[], // {code,name,unit,price,qty,discountPct}
    pendingItem:null // {code,name,unit,price,qty,discountPct}
  };
  renderCurrentView();
}
function closeWizard(){
  state.wizard = null;
  renderCurrentView();
}
function renderWizard(){
  const w = state.wizard;
  if(w.type === "voucher") return renderVoucherWizard(w);
  if(w.type === "return") return renderReturnWizard(w);
  if(w.type === "incoming") return renderIncomingWizard(w);
  if(w.type === "incomingView") return renderIncomingViewPrint(w.inc);
  if(w.type === "returnView") return renderReturnViewPrint(w.ret);
  if(w.type === "stocktakeView") return renderStocktakeViewPrint(w.rec);
  return "";
}

function bindWizardEvents(){
  const w = state.wizard;
  const closeBtn = document.getElementById("wizCloseBtn");
  if(closeBtn) closeBtn.onclick = ()=>{
    if(confirm("هل تريد إلغاء العملية الحالية؟")) closeWizard();
  };
  const backBtn = document.getElementById("wizBackBtn");
  if(backBtn) backBtn.onclick = ()=>{ w.step -= 1; renderCurrentView(); };
  const nextBtn = document.getElementById("wizNextBtn");
  if(nextBtn) nextBtn.onclick = ()=>{ w.step += 1; renderCurrentView(); };

  if(w.type==="voucher"){
    if(w.step===1){
      document.querySelectorAll("[data-rep]").forEach(b=>{
        b.onclick = ()=>{ w.rep = b.dataset.rep; renderCurrentView(); };
      });
      const qa = document.getElementById("quickAddRepBtn");
      if(qa) qa.onclick = ()=>quickAddModal("مندوب", async(name)=>{
        await state.db.collection("reps").add({name, createdAt:Date.now()});
        toast("تمت إضافة المندوب");
      });
    }
    if(w.step===2){
      document.querySelectorAll("[data-merchant]").forEach(b=>{
        b.onclick = ()=>{ w.merchant = b.dataset.merchant; renderCurrentView(); };
      });
      const qa = document.getElementById("quickAddMerchantBtn");
      if(qa) qa.onclick = ()=>quickAddMerchantModal(async(name, branch)=>{
        await state.db.collection("merchants").add({name, branch, createdAt:Date.now()});
        logActivity("إضافة تاجر", `${name} - ${branch}`);
        toast("تمت إضافة التاجر");
        w.merchant = branch ? `${name} - ${branch}` : name;
      });
    }
    if(w.step===3){
      document.querySelectorAll("[data-pick-product]").forEach(b=>{
        b.onclick = ()=>openItemConfigModal(b.dataset.pickProduct);
      });
      document.querySelectorAll("[data-remove-item]").forEach(b=>{
        b.onclick = ()=>{ w.items.splice(Number(b.dataset.removeItem),1); renderCurrentView(); };
      });
    }
    if(w.step===4){
      const saveBtn = document.getElementById("wizSaveBtn");
      if(saveBtn) saveBtn.onclick = saveVoucher;
    }
    if(w.step===5){
      const pb = document.getElementById("printVoucherBtn");
      if(pb) pb.onclick = ()=>window.print();
      const db2 = document.getElementById("doneVoucherBtn");
      if(db2) db2.onclick = closeWizard;
    }
  }

  if(w.type==="return"){
    bindReturnWizardEvents(w);
  }

  if(w.type==="incoming"){
    bindIncomingWizardEvents(w);
  }

  if(w.type==="incomingView"){
    const pb = document.getElementById("printIncomingBtn");
    if(pb) pb.onclick = ()=>window.print();
    const backBtn2 = document.getElementById("backIncomingViewBtn");
    if(backBtn2) backBtn2.onclick = closeWizard;
  }

  if(w.type==="returnView"){
    const pb = document.getElementById("printReturnBtn");
    if(pb) pb.onclick = ()=>window.print();
    const backBtn3 = document.getElementById("backReturnViewBtn");
    if(backBtn3) backBtn3.onclick = closeWizard;
  }

  if(w.type==="stocktakeView"){
    const pb = document.getElementById("printStViewBtn");
    if(pb) pb.onclick = ()=>window.print();
    const eb = document.getElementById("exportStViewBtn");
    if(eb) eb.onclick = ()=>exportStocktakeRecordXlsx(w.rec);
    const bb = document.getElementById("backStViewBtn");
    if(bb) bb.onclick = closeWizard;
  }
}

function openItemConfigModal(code){
  const p = state.products.find(pp=>pp.code===code);
  if(!p) return;
  const w = state.wizard;
  const upc = unitsPerCartonFor(p);
  const byPacks = p.unit === "كرتونة";
  const cfg = {qty:1, discountPct:0, mode:"carton", packQty:upc};
  const modalRoot = document.getElementById("modalRoot");
  function draw(){
    modalRoot.innerHTML = `
      <div class="overlay" id="ovl">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div style="font-weight:700; font-size:15px; margin-bottom:4px;">${p.name}</div>
          <div class="muted" style="margin-bottom:10px;">السعر: ${fmt(p.price)} / متاح: ${fmt(currentStock(p))} ${p.unit||""}</div>
          ${byPacks ? `
          <div class="section-title">وحدة الصرف</div>
          <div class="chip-row" id="modeChips">
            <button class="chip ${cfg.mode==='carton'?'selected':''}" data-mode="carton">بالكرتونة</button>
            <button class="chip ${cfg.mode==='pack'?'selected':''}" data-mode="pack">بالعلب (${upc} علبة/كرتونة)</button>
          </div>
          `:""}
          <div class="section-title">الكمية${cfg.mode==='pack'?" (بالعلب)":""}</div>
          <div class="stepper">
            <button id="qtyMinus">−</button>
            <input type="number" id="qtyVal" class="val" style="width:80px; text-align:center; border:1.5px solid var(--border); border-radius:10px; padding:6px 4px; background:var(--card); color:var(--text);" min="1" value="${cfg.mode==='pack'?cfg.packQty:cfg.qty}">
            <button id="qtyPlus">+</button>
          </div>
          ${cfg.mode==='pack' ? `<div class="muted" style="text-align:center;">= ${fmt(cfg.qty)} كرتونة</div>` : ""}
          ${cfg.qty > currentStock(p) ? `<div class="muted" style="color:var(--danger); text-align:center;">تنبيه: الكمية أكبر من المتاح بالمخزون</div>`:""}
          <div class="section-title">نسبة الخصم</div>
          <div class="muted" style="margin-top:-6px; margin-bottom:6px;">خصم أعلى من ${getMaxDiscount()}% هيحتاج موافقة الأدمن</div>
          <div class="chip-row" id="discChips">
            ${[0,5,10,15,20,25].map(d=>`<button class="chip ${cfg.discountPct===d/100?'selected':''}" data-disc="${d}">${d}%</button>`).join("")}
          </div>
          <div class="field">
            <label>خصم مخصص (%)</label>
            <input type="number" id="customDisc" min="0" max="100" value="${(cfg.discountPct*100).toFixed(0)}">
          </div>
          <div class="row-between" style="font-weight:800; padding:6px 2px 14px;">
            <span>الإجمالي</span><span>${fmt(cfg.qty*p.price*(1-cfg.discountPct))}</span>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="cancelItemBtn" style="flex:1;">إلغاء</button>
            <button class="btn btn-primary" id="addItemBtn" style="flex:1;">إضافة للإذن</button>
          </div>
        </div>
      </div>
    `;
    if(byPacks){
      document.querySelectorAll("[data-mode]").forEach(c=>{
        c.onclick = ()=>{
          cfg.mode = c.dataset.mode;
          if(cfg.mode==="pack"){ cfg.packQty = Math.max(1,Math.round(cfg.qty*upc)||upc); cfg.qty = cfg.packQty/upc; }
          else { cfg.qty = Math.max(1,Math.round(cfg.qty)); }
          draw();
        };
      });
    }
    document.getElementById("qtyMinus").onclick = ()=>{
      if(cfg.mode==="pack"){ cfg.packQty = Math.max(1,cfg.packQty-1); cfg.qty = cfg.packQty/upc; }
      else { cfg.qty = Math.max(1,cfg.qty-1); }
      draw();
    };
    document.getElementById("qtyPlus").onclick = ()=>{
      if(cfg.mode==="pack"){ cfg.packQty += 1; cfg.qty = cfg.packQty/upc; }
      else { cfg.qty += 1; }
      draw();
    };
    document.getElementById("qtyVal").onchange = (e)=>{
      let v = Math.round(Number(e.target.value));
      if(isNaN(v) || v<1) v = 1;
      if(cfg.mode==="pack"){ cfg.packQty = v; cfg.qty = v/upc; }
      else { cfg.qty = v; }
      draw();
    };
    document.querySelectorAll("[data-disc]").forEach(c=>{
      c.onclick = ()=>{ cfg.discountPct = Number(c.dataset.disc)/100; draw(); };
    });
    document.getElementById("customDisc").onchange = (e)=>{
      let v = Number(e.target.value); if(isNaN(v)||v<0) v=0; if(v>100) v=100;
      cfg.discountPct = v/100; draw();
    };
    document.getElementById("cancelItemBtn").onclick = closeModal;
    document.getElementById("addItemBtn").onclick = async ()=>{
      const pct = cfg.discountPct*100;
      const ok = await approveHighDiscount(pct);
      if(!ok) return;
      w.items.push({
        code:p.code, name:p.name, unit:p.unit, price:Number(p.price)||0, qty:cfg.qty, discountPct:cfg.discountPct,
        packQty: cfg.mode==="pack" ? cfg.packQty : null, unitsPerCarton: cfg.mode==="pack" ? upc : null
      });
      closeModal();
      renderCurrentView();
    };
    document.getElementById("ovl").addEventListener("click", (e)=>{ if(e.target.id==="ovl") closeModal(); });
  }
  draw();
}

async function saveVoucher(){
  const w = state.wizard;
  const total = w.items.reduce((s,it)=>s+it.qty*it.price*(1-it.discountPct),0);
  const nn = await makeNumber("voucher");
  const voucher = {
    number: nn.number, ...pendingFlags(nn),
    date: w.date,
    rep: w.rep,
    merchant: w.merchant,
    items: w.items,
    total: total,
    createdAt: Date.now()
  };
  try{
    await state.db.collection("vouchers").add(voucher);

    qty: existing ? existing.qty : 1,
    reason: existing ? existing.reason : null,

    mode: existing && existing.packQty ? "pack" : "carton",

  };

    modalRoot.innerHTML = `

          </div>
          `:""}
          <div class="section-title">الكمية المرتجعة${cfg.mode==='pack'?" (بالعلب)":""}</div>
          <div class="stepper">
            <button id="rItemQtyMinus">−</button>
            <input type="number" id="rItemQtyVal" class="val" style="width:80px; text-align:center; border:1.5px solid var(--border); border-radius:10px; padding:6px 4px; background:var(--card); color:var(--text);" min="1" value="${cfg.mode==='pack'?cfg.packQty:cfg.qty}">
            <button id="rItemQtyPlus">+</button>
          </div>
          ${cfg.mode==='pack' ? `<div class="muted" style="text-align:center;">= ${fmt(cfg.qty)} كرتونة</div>` : ""}

          <div class="section-title">السبب</div>
          <div class="chip-row" id="rReasonChips">
            ${reasons.map(r=>`<button class="chip ${cfg.reason===r?'selected':''}" data-rreason="${escapeAttr(r)}">${r}</button>`).join("")}
          </div>
          ${cfg.reason==="أخرى" ? `<div class="field"><label>وضّح السبب</label><input type="text" id="rCustomReason" value="${escapeAttr(cfg.customReason)}"></div>` : ""}
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-ghost" id="cancelRItemBtn" style="flex:1;">إلغاء</button>
            <button class="btn btn-primary" id="addRItemBtn" style="flex:1;" ${cfg.reason?"":"disabled"}>${existing?"تحديث":"إضافة"}</button>
          </div>
        </div>
      </div>
    `;
    if(byPacks){
      document.querySelectorAll("[data-rmode]").forEach(c=>{
        c.onclick = ()=>{
          cfg.mode = c.dataset.rmode;
          if(cfg.mode==="pack"){ cfg.packQty = Math.max(1,Math.round(cfg.qty*upc)||upc); cfg.qty = cfg.packQty/upc; }
          else { cfg.qty = Math.max(1,Math.round(cfg.qty)); }
          draw();
        };
      });
    }
    document.getElementById("rItemQtyMinus").onclick = ()=>{
      if(cfg.mode==="pack"){ cfg.packQty = Math.max(1,cfg.packQty-1); cfg.qty = cfg.packQty/upc; }
      else { cfg.qty = Math.max(1,cfg.qty-1); }
      draw();
    };
    document.getElementById("rItemQtyPlus").onclick = ()=>{
      if(cfg.mode==="pack"){ cfg.packQty += 1; cfg.qty = cfg.packQty/upc; }
      else { cfg.qty += 1; }
      draw();
    };
    document.getElementById("rItemQtyVal").onchange = (e)=>{
      let v = Math.round(Number(e.target.value));
      if(isNaN(v) || v<1) v = 1;
      if(cfg.mode==="pack"){ cfg.packQty = v; cfg.qty = v/upc; }
      else { cfg.qty = v; }
      draw();
    };
    document.querySelectorAll("[data-rreason]").forEach(c=>{
      c.onclick = ()=>{ cfg.reason = c.dataset.rreason; draw(); };
    });
    const cri = document.getElementById("rCustomReason");
    if(cri) cri.onchange = (e)=>{ cfg.customReason = e.target.value; };
    document.getElementById("cancelRItemBtn").onclick = closeModal;
    document.getElementById("addRItemBtn").onclick = ()=>{
      const line = {
        code:voucherItem.code, name:voucherItem.name, unit:voucherItem.unit, price:voucherItem.price, qty:cfg.qty,
        reason:cfg.reason, customReason:cfg.customReason,
        packQty: cfg.mode==="pack" ? cfg.packQty : null, unitsPerCarton: cfg.mode==="pack" ? upc : null
      };
      if(existing){ Object.assign(existing, line); }
      else { w.items.push(line); }
      closeModal();
      renderCurrentView();
    };
    document.getElementById("ovl").addEventListener("click", (e)=>{ if(e.target.id==="ovl") closeModal(); });
  }
  draw();
}
async function saveReturn(){

          <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-ghost" id="cancelIncItemBtn" style="flex:1;">إلغاء</button>
            <button class="btn btn-primary" id="addIncItemBtn" style="flex:1;">${existing?"تحديث":"إضافة"}</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("incQtyMinus").onclick = ()=>{ cfg.qty = Math.max(1,cfg.qty-1); draw(); };
    document.getElementById("incQtyPlus").onclick = ()=>{ cfg.qty += 1; draw(); };
    document.getElementById("incQtyVal").onchange = (e)=>{
      let v = Math.round(Number(e.target.value));
      if(isNaN(v) || v<1) v = 1;
      cfg.qty = v; draw();
    };
    document.getElementById("cancelIncItemBtn").onclick = closeModal;
    document.getElementById("addIncItemBtn").onclick = ()=>{
      if(existing){ existing.qty = cfg.qty; }
      else { w.items.push({code:p.code, name:p.name, unit:p.unit, qty:cfg.qty}); }
      closeModal();
      renderCurrentView();
    };
    document.getElementById("ovl").addEventListener("click", (e)=>{ if(e.target.id==="ovl") closeModal(); });
  }
  draw();
}
async function saveIncoming(){
  const w = state.wizard;
  const totalQty = w.items.reduce((s,it)=>s+(Number(it.qty)||0),0);
  const nn = await makeNumber("incoming");
  const inc = {
    number: nn.number, ...pendingFlags(nn),
    date: w.date,
    supplier: w.supplier || "",
    note: w.note || "",
    items: w.items,
    totalQty: totalQty,
    createdAt: Date.now()
  };
  try{
    await state.db.collection("incoming").add(inc);
    w.step = 3;
    logActivity("تسجيل وارد", `${inc.number} - ${inc.items.map(it=>`${it.name} ×${fmt(it.qty)}`).join("، ")}${inc.supplier?` (${inc.supplier})`:""}`);

    renderCurrentView();
  }catch(e){
    console.error(e);
    toast("حدث خطأ أثناء الحفظ، حاول مرة أخرى");
  }
}

let reportsPeriod = "month";
let reportsAnchor = todayStr();

function renderReports(){
  const range = getPeriodRange(reportsPeriod, reportsAnchor);
  const vouchers = reportsPeriod==="all" ? state.vouchers : state.vouchers.filter(v=>inRange(v.date, range));
  const returns = reportsPeriod==="all" ? state.returns : state.returns.filter(r=>inRange(r.date, range));
  const incoming = reportsPeriod==="all" ? state.incoming : state.incoming.filter(inc=>inRange(inc.date, range));

  const totalSales = vouchers.reduce((s,v)=>s+(Number(v.total)||0),0);
  let totalDiscount = 0, totalQtyOut = 0;
  for(const v of vouchers){
    for(const it of (v.items||[])){
      totalDiscount += it.qty*it.price*it.discountPct;
      totalQtyOut += Number(it.qty)||0;
    }
  }
  const totalReturned = returns.reduce((s,r)=>s+(Number(r.qty)||0),0);
  const totalIncoming = incoming.reduce((s,inc)=>s+(Number(inc.totalQty)||0),0);

  const byRep = {};
  for(const v of vouchers) byRep[v.rep] = (byRep[v.rep]||0) + (Number(v.total)||0);
  const byMerchant = {};
  for(const v of vouchers) byMerchant[v.merchant] = (byMerchant[v.merchant]||0) + (Number(v.total)||0);
  const productDetail = {}; // code -> {name, qtyOut, valueOut, qtyReturned}
  for(const v of vouchers) for(const it of (v.items||[])){
    if(!productDetail[it.code]) productDetail[it.code] = {name:it.name, qtyOut:0, valueOut:0, qtyReturned:0};
    productDetail[it.code].qtyOut += Number(it.qty)||0;
    productDetail[it.code].valueOut += it.qty*it.price*(1-it.discountPct);
  }
  for(const r of returns) for(const it of (r.items||[])){
    if(!productDetail[it.code]) productDetail[it.code] = {name:it.name, qtyOut:0, valueOut:0, qtyReturned:0};
    productDetail[it.code].qtyReturned += Number(it.qty)||0;
  }
  const productRows = Object.values(productDetail).sort((a,b)=>b.valueOut-a.valueOut);

  const periodChips = ["day","week","month","quarter","half","year","all"].map(p=>
    `<button class="chip ${reportsPeriod===p?'selected':''}" data-period="${p}">${PERIOD_LABELS[p]}</button>`
  ).join("");
  const rangeLabel = reportsPeriod==="all" ? "كل الفترات" : `${range.start} → ${range.end}`;
  const generatedAt = new Date().toLocaleString("ar-EG");

  return `
    <div class="chip-row no-print" style="margin-bottom:8px;">${periodChips}</div>
    ${reportsPeriod!=="all" ? `
    <div class="row-between no-print" style="margin-bottom:12px;">
      <button class="btn btn-ghost btn-sm" id="periodPrevBtn">‹ السابق</button>
      <div class="muted" style="font-weight:700; font-size:12.5px;">${rangeLabel}</div>
      <button class="btn btn-ghost btn-sm" id="periodNextBtn">التالي ›</button>
    </div>
    ${reportsAnchor!==todayStr() ? `<button class="btn btn-outline btn-sm no-print" id="periodTodayBtn" style="width:100%; margin-bottom:12px;">↺ الرجوع للفترة الحالية</button>` : ""}
    ` : ""}
    <button class="btn btn-outline no-print" style="width:100%; margin-bottom:12px;" id="printReportBtn">🖨️ طباعة التقرير</button>
    <div class="voucher-print" id="printArea">
      <div class="vp-head">
        <h2>${currentAppName()}</h2>
        <div>تقرير أداء المبيعات والمخزون</div>
        <div style="font-size:12px; color:#555;">الفترة: ${rangeLabel}</div>
        <div class="no-print" style="font-size:11px; color:#888; margin-top:2px;">تم إصدار التقرير: ${generatedAt}${state.currentUser?` · بواسطة: ${state.currentUser.username}`:""}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="num">${fmt(totalSales)}</div><div class="lbl">إجمالي المبيعات</div></div>
        <div class="stat-card"><div class="num">${fmt(totalDiscount)}</div><div class="lbl">إجمالي الخصومات</div></div>
        <div class="stat-card"><div class="num">${fmt(totalQtyOut)}</div><div class="lbl">إجمالي الكميات المصروفة</div></div>
        <div class="stat-card"><div class="num">${fmt(totalReturned)}</div><div class="lbl">إجمالي الكميات المرتجعة</div></div>
        <div class="stat-card"><div class="num">${fmt(totalIncoming)}</div><div class="lbl">إجمالي الكميات الواردة</div></div>
      </div>
      <div class="section-title">🎯 أداء المناديب (للفترة المختارة)</div>
      <div class="card">${repPerformanceList(vouchers, returns)}</div>
      <div class="section-title">حسب المندوب</div>
      <div class="card">${barList(byRep)}</div>
      <div class="section-title">حسب التاجر</div>
      <div class="card">${barList(byMerchant)}</div>
      <div class="section-title">حركة الأصناف بالتفصيل</div>
      <table>
        <tr><th>الصنف</th><th>مصروف</th><th>قيمة المصروف</th><th>مرتجع</th><th>صافي الكمية</th></tr>
        ${productRows.length ? productRows.map(pr=>`
          <tr>
            <td style="text-align:right;">${pr.name}</td>
            <td>${fmt(pr.qtyOut)}</td>
            <td>${fmt(pr.valueOut)}</td>
            <td>${fmt(pr.qtyReturned)}</td>
            <td>${fmt(pr.qtyOut-pr.qtyReturned)}</td>
          </tr>
        `).join("") : `<tr><td colspan="5">لا توجد بيانات كافية بعد</td></tr>`}
      </table>
    </div>
  `;
}
function repPerformanceList(vouchers, returns){
  const map = {};
  const touch = (name)=>{ if(!map[name]) map[name] = {vouchers:0, total:0, returns:0}; return map[name]; };
  for(const v of vouchers){
    if(!v.rep) continue;
    const m = touch(v.rep);
    m.vouchers++;
    m.total += Number(v.total)||0;
  }
  for(const r of returns){
    if(!r.rep) continue;
    touch(r.rep).returns++;
  }
  const entries = Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
  if(!entries.length) return `<div class="muted">لا توجد بيانات كافية بعد</div>`;
  return entries.map(([rep,d])=>`
    <div class="list-item" style="margin-bottom:8px;">
      <div class="title-line"><span>👤 ${rep}</span><span class="sum">${fmt(d.total)}</span></div>
      <div class="meta">🧾 ${fmt(d.vouchers)} إذن صرف · ↩️ ${fmt(d.returns)} مرتجع</div>
    </div>
  `).join("");
}
function barList(obj, limit){
  let entries = Object.entries(obj).filter(([k])=>k && k!=="undefined");
  entries.sort((a,b)=>b[1]-a[1]);
  if(limit) entries = entries.slice(0,limit);
  if(!entries.length) return `<div class="muted">لا توجد بيانات كافية بعد</div>`;
  const max = entries[0][1] || 1;
  return entries.map(([k,v])=>`
    <div class="bar-row">
      <div class="lbl-line"><span>${k}</span><span>${fmt(v)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(v/max*100))}%;"></div></div>
    </div>
  `).join("");
}
function bindReportsEvents(){
  document.querySelectorAll("[data-period]").forEach(c=>{
    c.onclick = ()=>{
      reportsPeriod = c.dataset.period;
      reportsAnchor = todayStr();
      renderCurrentView();
    };
  });
  const prevBtn = document.getElementById("periodPrevBtn");
  const nextBtn = document.getElementById("periodNextBtn");
  const todayBtn = document.getElementById("periodTodayBtn");
  if(prevBtn) prevBtn.onclick = ()=>{ reportsAnchor = shiftAnchor(reportsPeriod, reportsAnchor, -1); renderCurrentView(); };
  if(nextBtn) nextBtn.onclick = ()=>{ reportsAnchor = shiftAnchor(reportsPeriod, reportsAnchor, 1); renderCurrentView(); };
  if(todayBtn) todayBtn.onclick = ()=>{ reportsAnchor = todayStr(); renderCurrentView(); };
  const printBtn = document.getElementById("printReportBtn");
  if(printBtn) printBtn.onclick = ()=>window.print();
}

   STOCKTAKE TAB (الجرد)
   - تقرير الجرد (عرض وطباعة بدون أسعار): بحسب صلاحية "الجرد"
   - الجرد الفعلي وسجل الجرد: للسوبر أدمن فقط

let stocktakeCatFilter = "الكل";
let stocktakeSearch = "";
let stocktakeSub = "report"; // report | count | log
let actualCounts = {};       // code -> قيمة الجرد الفعلي (نص)
let actualNote = "";

function normAr(x){
  return String(x==null?"":x).toLowerCase()
    .replace(/[\u064B-\u065F\u0640]/g,"")
    .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
}
function matchesSearch(p, q){
  q = normAr(q).trim();
  if(!q) return true;
  return normAr(p.name).includes(q) || normAr(p.code).includes(q);
}
function stocktakeRowsData(){
  const filtered = state.products.filter(p=>
    (stocktakeCatFilter==="الكل" || p.category===stocktakeCatFilter) && matchesSearch(p, stocktakeSearch)
  );
  return [...filtered].sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
}
function nextStocktakeNo(){
  let max = 0;
  for(const r of state.stocktakes){
    const n = parseInt(String(r.number).replace("ST-",""),10);
    if(!isNaN(n) && n>max) max = n;
  }
  return "ST-"+(max+1);
}

function stocktakeReportHtml(){
  const rows = stocktakeRowsData();
  let sumOpening=0, sumIncoming=0, sumDispatched=0, sumReturned=0, sumRemaining=0;
  const rowsHtml = rows.map(p=>{
    const opening = Number(p.opening)||0;
    const incoming = incomingQty(p.code);
    const dispatched = dispatchedQty(p.code);
    const returned = returnedQty(p.code);
    const remaining = currentStock(p);
    sumOpening+=opening; sumIncoming+=incoming; sumDispatched+=dispatched; sumReturned+=returned; sumRemaining+=remaining;
    const low = remaining<=LOW_STOCK_THRESHOLD;
    return `<tr${low?' style="color:var(--danger); font-weight:700;"':''}>
      <td style="text-align:right;">${p.name}<div style="font-size:10px; opacity:.7; font-weight:400;">${p.code}</div></td>
      <td>${p.category||"-"}</td>
      <td>${fmt(opening)}</td>
      <td>${fmt(incoming)}</td>
      <td>${fmt(dispatched)}</td>
      <td>${fmt(returned)}</td>
      <td>${fmt(remaining)} ${p.unit||""}</td>
    </tr>`;
  }).join("");
  const filterLabel = [
    stocktakeCatFilter!=="الكل" ? `تصنيف: ${stocktakeCatFilter}` : "",
    stocktakeSearch.trim() ? `بحث: ${stocktakeSearch.trim()}` : ""
  ].filter(Boolean).join(" · ");
  return `
    <div class="stat-grid no-print" style="margin-bottom:10px;">
      <div class="stat-card"><div class="num">${fmt(sumRemaining)}</div><div class="lbl">إجمالي المتبقي بالمخزون</div></div>
      <div class="stat-card"><div class="num">${fmt(sumDispatched)}</div><div class="lbl">إجمالي المصروف</div></div>
      <div class="stat-card"><div class="num">${fmt(sumIncoming)}</div><div class="lbl">إجمالي الوارد</div></div>
      <div class="stat-card"><div class="num">${fmt(sumReturned)}</div><div class="lbl">إجمالي المرتجع</div></div>
    </div>
    <div class="voucher-print" id="printArea">
      <div class="vp-head">
        <h2>${currentAppName()}</h2>
        <div>تقرير جرد المخزون</div>
        <div style="font-size:12px; color:#555;">${todayStr()}${filterLabel?` · ${filterLabel}`:""}</div>
      </div>
      <table>
        <tr><th>الصنف</th><th>التصنيف</th><th>افتتاحي</th><th>وارد</th><th>مصروف</th><th>مرتجع</th><th>المتبقي</th></tr>
        ${rowsHtml || `<tr><td colspan="7">لا توجد أصناف</td></tr>`}
        <tr style="font-weight:800;">
          <td colspan="2">الإجمالي</td>
          <td>${fmt(sumOpening)}</td><td>${fmt(sumIncoming)}</td><td>${fmt(sumDispatched)}</td><td>${fmt(sumReturned)}</td><td>${fmt(sumRemaining)}</td>
        </tr>
      </table>
      <div class="muted no-print" style="margin-top:10px; font-size:11px;">🔴 الصفوف الحمراء: أصناف وصلت لحد المخزون المنخفض (${LOW_STOCK_THRESHOLD} أو أقل).</div>
    </div>
  `;
}

function diffBadge(sys, raw){
  if(raw===undefined || raw==="" || isNaN(Number(raw))) return `<span class="badge badge-warn">لم يُجرد</span>`;
  const d = Number(raw) - sys;
  if(d===0) return `<span class="badge badge-ok">مطابق</span>`;
  if(d>0) return `<span class="badge badge-warn">زيادة +${fmt(d)}</span>`;
  return `<span class="badge badge-low">عجز ${fmt(d)}</span>`;
}
function actualCountHtml(){
  const rows = stocktakeRowsData();
  if(!rows.length) return `<div class="empty-state"><div class="ic">🔎</div>لا توجد أصناف مطابقة</div>`;
  return rows.map(p=>{
    const sys = currentStock(p);
    const v = actualCounts[p.code];
    return `
    <div class="list-item">
      <div class="title-line"><span>${iconForProduct(p.name)} ${p.name}</span><span class="muted" style="font-size:11px;">${p.code}</span></div>

          style="width:92px; padding:8px; border:1.5px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); text-align:center; font-size:14px;">
        <span class="ac-diff">${diffBadge(sys, v)}</span>

  }).join("");
}

async function saveActualCount(){
  if(!isSuper()){ toast("الجرد الفعلي للسوبر أدمن فقط"); return; }
  const items = [];
  for(const p of state.products){
    const raw = actualCounts[p.code];
    if(raw===undefined || raw==="") continue;
    const actual = Number(raw);
    if(isNaN(actual)) continue;
    const system = currentStock(p);
    items.push({code:p.code, name:p.name, category:p.category||"", unit:p.unit||"", system, actual, diff: actual-system});
  }
  if(!items.length){ toast("اكتب الكمية الفعلية لصنف واحد على الأقل"); return; }
  const uncounted = state.products.length - items.length;
  if(!confirm(`حفظ الجرد الفعلي لعدد ${items.length} صنف؟${uncounted>0?`\n(${uncounted} صنف لم يتم جرده)`:""}`)) return;
  const shortage = items.reduce((s,it)=>s+(it.diff<0?-it.diff:0),0);
  const surplus = items.reduce((s,it)=>s+(it.diff>0?it.diff:0),0);
  const rec = {
    number: nextStocktakeNo(), date: todayStr(), by: state.currentUser.username,
    note: actualNote||"", items, shortage, surplus, createdAt: Date.now()
  };
  try{
    await state.db.collection("stocktakes").add(rec);
    logActivity("جرد فعلي", `${rec.number} - ${items.length} صنف (عجز ${fmt(shortage)} / زيادة ${fmt(surplus)})`);
    actualCounts = {}; actualNote = ""; stocktakeSub = "log";
    toast("تم حفظ الجرد الفعلي");
    forceRender();
  }catch(e){
    console.error(e);
    toast("حدث خطأ أثناء الحفظ (تأكد من صلاحيات Firestore لمجموعة stocktakes)");
  }
}

function exportWorkbook(sheets, filename){
  if(!hasPerm("export")){ noPermToast(); return; }
  if(typeof XLSX === "undefined"){ toast("مكتبة Excel لم تُحمَّل، تأكد من الاتصال بالإنترنت وحاول تاني"); return; }
  try{
    const wb = XLSX.utils.book_new();
    sheets.forEach(sh=>{
      const ws = XLSX.utils.aoa_to_sheet(sh.rows);
      ws["!cols"] = sh.rows[0].map(()=>({wch:18}));
      XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0,31));
    });
    wb.Workbook = {Views:[{RTL:true}]};
    XLSX.writeFile(wb, filename);
    logActivity("تصدير Excel", filename);
    toast("تم تجهيز ملف Excel");
  }catch(e){ console.error(e); toast("تعذر إنشاء ملف Excel"); }
}

function exportStocktakeXlsx(){
  const rows = stocktakeRowsData();
  const data = [["الكود","الصنف","التصنيف","الوحدة","افتتاحي","وارد","مصروف","مرتجع","المتبقي"]];
  let sO=0,sI=0,sD=0,sR=0,sM=0;
  rows.forEach(p=>{
    const o=Number(p.opening)||0, i=incomingQty(p.code), d=dispatchedQty(p.code), r=returnedQty(p.code), m=currentStock(p);
    sO+=o; sI+=i; sD+=d; sR+=r; sM+=m;
    data.push([p.code, p.name, p.category||"", p.unit||"", o, i, d, r, m]);
  });
  data.push(["","الإجمالي","","",sO,sI,sD,sR,sM]);
  exportWorkbook([{name:"جرد المخزون", rows:data}], `stocktake-${todayStr()}.xlsx`);
}

function exportStocktakeRecordXlsx(rec){
  const data = [["الكود","الصنف","التصنيف","الوحدة","بالنظام","الفعلي","الفرق"]];
  (rec.items||[]).forEach(it=>data.push([it.code, it.name, it.category||"", it.unit||"", it.system, it.actual, it.diff]));
  data.push(["","إجمالي العجز","","","","",-(rec.shortage||0)]);
  data.push(["","إجمالي الزيادة","","","","",rec.surplus||0]);
  exportWorkbook([{name:"جرد فعلي", rows:data}], `stocktake-count-${rec.number}.xlsx`);
}

function filteredVouchersList(){
  let list = [...state.vouchers].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(voucherDateFrom) list = list.filter(v=>v.date && v.date>=voucherDateFrom);
  if(voucherDateTo) list = list.filter(v=>v.date && v.date<=voucherDateTo);
  return list;
}
function filteredReturnsList(){
  let list = [...state.returns].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(returnDateFrom) list = list.filter(r=>r.date && r.date>=returnDateFrom);
  if(returnDateTo) list = list.filter(r=>r.date && r.date<=returnDateTo);
  return list;
}

function exportVouchersXlsx(){
  const list = filteredVouchersList();
  if(!list.length){ toast("لا توجد أذون لتصديرها"); return; }
  const summary = [["رقم الإذن","التاريخ","المندوب","التاجر / الفرع","عدد الأصناف","الإجمالي"]];
  const lines = [["رقم الإذن","التاريخ","المندوب","التاجر / الفرع","كود الصنف","الصنف","الوحدة","الكمية","بالعلب","السعر","الخصم %","الإجمالي بعد الخصم"]];
  let grand = 0;
  list.forEach(v=>{
    const items = v.items||[];
    summary.push([v.number, v.date||"", v.rep||"", v.merchant||"", items.length, Number(v.total)||0]);
    grand += Number(v.total)||0;
    items.forEach(it=>{
      lines.push([v.number, v.date||"", v.rep||"", v.merchant||"", it.code, it.name, it.unit||"",
        Number(it.qty)||0, it.packQty||"", Number(it.price)||0, Math.round((Number(it.discountPct)||0)*100),
        (Number(it.qty)||0)*(Number(it.price)||0)*(1-(Number(it.discountPct)||0))]);
    });
  });
  summary.push(["","","","","الإجمالي الكلي",grand]);
  exportWorkbook([{name:"ملخص الأذون", rows:summary},{name:"تفاصيل الأصناف", rows:lines}], `vouchers-${todayStr()}.xlsx`);
}

function exportReturnsXlsx(){
  const list = filteredReturnsList();
  if(!list.length){ toast("لا توجد مرتجعات لتصديرها"); return; }
  const data = [["رقم المرتجع","التاريخ","إذن الصرف الأصلي","المندوب","التاجر / الفرع","كود الصنف","الصنف","الوحدة","الكمية","بالعلب","السبب"]];
  list.forEach(r=>{
    (r.items||[]).forEach(it=>{
      data.push([r.number, r.date||"", r.voucherNumber||"", r.rep||"", r.merchant||"", it.code, it.name, it.unit||"", Number(it.qty)||0, it.packQty||"", it.reason||""]);
    });
  });
  exportWorkbook([{name:"المرتجعات", rows:data}], `returns-${todayStr()}.xlsx`);
}

function exportIncomingXlsx(){
  const list = [...state.incoming].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

function permsCheckboxesHtml(perms){
  const cur = perms || defaultPerms();
  return `<div class="perm-list">${PERMS.map(pp=>`<label><input type="checkbox" data-perm="${pp.key}" ${cur[pp.key]?"checked":""}> <span>${pp.label}</span></label>`).join("")}</div>`;
}
function readPermsFromModal(){
  const o = {};
  document.querySelectorAll("[data-perm]").forEach(c=>{ o[c.dataset.perm] = c.checked; });
  return o;
}

function escapeAttr(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 480;
  quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=>reject(new Error("تعذر قراءة الصورة"));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error("تعذر قراءة الملف"));
    reader.readAsDataURL(file);
  });
}

function merchantLabel(m){
  return m.branch ? `${m.name} - ${m.branch}` : m.name;
}
